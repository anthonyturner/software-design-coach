<div
  class="entities"
  role="group"
  [attr.aria-labelledby]="list().promptId"
  [attr.aria-describedby]="question().hint ? list().hintId : null"
>
  <p class="field__label" [id]="list().promptId">{{ question().prompt }}</p>
  @if (question().hint; as hint) {
    <p class="field__hint" [id]="list().hintId">{{ hint }}</p>
  }

  @if (list().rows.length === 0) {
    <p class="entities__empty">{{ list().emptyText }}</p>
  } @else {
    <ol class="entities__list">
      @for (row of list().rows; track row.id) {
        <li class="entity">
          <fieldset class="entity__group">
            <legend class="entity__legend">{{ row.legend }}</legend>

            <div class="entity__field">
              <label class="field__label" [attr.for]="row.nameId">{{ row.nameLabel }}</label>
              <input
                #nameInput
                class="field__input"
                type="text"
                autocomplete="off"
                [id]="row.nameId"
                [attr.data-focus]="'name:' + row.id"
                [value]="row.name"
                (input)="editName(row.id, nameInput.value)"
              />
            </div>

            @for (field of list().fields; track field.key) {
              <sdc-entity-field
                [entities]="entities()"
                [kind]="list().kind"
                [row]="row.entity"
                [field]="field"
                [idBase]="list().idBase"
                (edited)="editField(row.id, field.key, $event)"
              />
            }

            <div class="entity__actions">
              <button
                type="button"
                class="button button--small"
                [attr.data-focus]="'up:' + row.id"
                [attr.aria-label]="row.moveUpLabel"
                [disabled]="!row.canMoveUp"
                (click)="move(row.id, -1)"
              >
                <span aria-hidden="true">&uarr;</span> Up
              </button>
              <button
                type="button"
                class="button button--small"
                [attr.data-focus]="'down:' + row.id"
                [attr.aria-label]="row.moveDownLabel"
                [disabled]="!row.canMoveDown"
                (click)="move(row.id, 1)"
              >
                <span aria-hidden="true">&darr;</span> Down
              </button>
              <button
                type="button"
                class="button button--small"
                [attr.aria-label]="row.removeLabel"
                (click)="remove(row.id)"
              >
                Remove
              </button>
            </div>
          </fieldset>
        </li>
      }
    </ol>
  }

  <button type="button" class="button entities__add" data-focus="add" (click)="add()">{{ list().addLabel }}</button>
</div>
