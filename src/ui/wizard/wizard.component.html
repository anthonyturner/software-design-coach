<a class="wizard__back" routerLink="/">&larr; All projects</a>

@switch (store.openState()) {
  @case ('open') {
    @if (view(); as v) {
      <header class="wizard__header">
        <h2 class="wizard__title">{{ v.projectName }}</h2>
        <p class="wizard__mode">{{ v.workflowTitle }}</p>
        <a class="wizard__summary button button--small" [routerLink]="['/projects', id(), 'summary']">View summary</a>
      </header>
      <div class="wizard__layout" [class.wizard__layout--diagram]="v.diagram !== undefined">
        <sdc-journey-rail class="wizard__rail" [stops]="store.journey()" (selected)="goTo($event)" />
        <sdc-step-panel
          [step]="v.step"
          [answers]="v.answers"
          [entities]="v.entities"
          [note]="v.note"
          [stepNumber]="v.stepNumber"
          [stepCount]="v.stepCount"
          [openCount]="store.openQuestionCount()"
          [canGoBack]="v.previousId !== undefined"
          [canContinue]="v.nextId !== undefined"
          [arrival]="arrival()"
          (answered)="answer($event)"
          (noted)="store.setNote(v.step.id, $event)"
          (entityChanged)="store.changeEntities($event.entity, $event.change)"
          (back)="goBack(v.previousId)"
          (next)="goTo(v.nextId)"
        />
        @if (v.diagram; as diagram) {
          <div #side class="wizard__side">
            <sdc-diagram-panel
              [kind]="diagram.kind"
              [source]="diagram.source"
              [nodes]="diagram.names"
              (nodeActivated)="openModule($event)"
            />
            @if (drawer(); as module) {
              <sdc-module-drawer [module]="module" (closed)="closeDrawer()" />
            }
          </div>
        }
      </div>
    }
  }
  @default {
    <sdc-open-state-message [state]="store.openState()" />
  }
}

<sdc-storage-notice [problem]="store.problem()" />
