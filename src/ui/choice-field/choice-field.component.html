<fieldset class="choice" [attr.aria-describedby]="describedBy()">
  <legend class="field__label">{{ question().prompt }}</legend>
  @if (question().hint; as hint) {
    <p class="field__hint" [id]="hintId()">{{ hint }}</p>
  }
  @if (isEmpty()) {
    <p class="field__hint" [id]="emptyId()">{{ emptyText() }}</p>
  }
  @for (option of options(); track option.value) {
    <div class="choice__option">
      <label class="choice__row">
        <input
          class="choice__radio"
          type="radio"
          [attr.name]="groupId()"
          [value]="option.value"
          [checked]="option.checked"
          [attr.aria-describedby]="option.detailId"
          (change)="answered.emit(option.value)"
        />
        <span>{{ option.label }}</span>
      </label>
      @if (option.detail; as detail) {
        <span class="choice__detail" [id]="option.detailId">{{ detail }}</span>
      }
    </div>
  }
</fieldset>
